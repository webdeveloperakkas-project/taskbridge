
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - TaskBridge</title>

    <meta
        name="description"
        content="Secure administrator sign-in for TaskBridge."
    >

    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Brand -->
            <div class="login-brand">

                <a href="./index.html" class="logo">
                    Task<span>Bridge</span>
                </a>

                <p>Your Global Micro Jobs Marketplace</p>

            </div>

            <!-- Login Card -->
            <div class="login-card">

                <!-- Heading -->
                <div class="login-heading">

                    <h1>Administrator Login</h1>

                    <p>
                        Sign in with your authorized administrator account
                        and continue your journey.
                    </p>

                </div>

                <!-- Login Form -->
                <form
                    id="loginForm"
                    method="POST"
                    action="./admin-login.html"
                >

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginIdentity">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginIdentity"
                            name="loginIdentity"
                            placeholder="Enter your email address"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <!-- Password -->
                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <!-- Remember Me and Forgot Password -->
                    <div class="login-options">

                        <div class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe"
                            >

                            <label for="rememberMe">
                                Remember Me
                            </label>

                        </div>

                        <a href="./forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Login Error / Status Message -->
                    <div
                        id="loginMessage"
                        class="login-message"
                        role="alert"
                        aria-live="polite"
                        hidden
                    ></div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        Log In
                    </button>

                </form>

                <!-- Registration Link -->
                <div class="register-link"><p>Administrator access only. User accounts cannot access the Admin Control Panel.</p></div>

                </div>

            <!-- Footer -->
            <div class="login-footer">

                <p>
                    &copy; <span id="current-year">2026</span>
                    TaskBridge. All Rights Reserved.
                </p>

            </div>

        </div>

    </main>

    <!-- Supabase JavaScript Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- TaskBridge Admin Login JavaScript -->
<script src="./admin-login.js" defer></script>

</body>
</html>
